name: SignVision CI

"on":
  push:
    branches:
      - main
      - "feature/**"
  pull_request: {}
  workflow_dispatch:
    inputs:
      evaluate_candidate:
        description: "Run evidence-backed candidate approval (main only; no deployment)"
        type: boolean
        default: false
      candidate_ref:
        description: "Reviewed candidate commit SHA/ref in this repository (blank uses workflow SHA)"
        type: string
        default: ""
      candidate_bundle:
        description: "Candidate model bundle directory relative to the candidate checkout"
        type: string
        default: backend/data/models

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
      SIGNVISION_TRACKING_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      # Dependency-isolated tests need only the standard library. The separate
      # smoke_browser_camera.py integration script is not matched by test_*.py.
      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v
      - name: Check backend Python syntax
        # MLflow tag/artifact filenames can end in .py without being source code.
        run: python -m compileall -q -x '(^|[\\/])(data|mlruns|mlartifacts)([\\/]|$)' backend

  frontend:
    name: Frontend checks (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit

  # Actual private dataset validation is performed ONLY by dataset-validation.yml
  # from the protected default branch. No dataset or reader credentials reach PR code.
  pr_model_gate:
    name: PR model gate (sandbox; production fail-closed)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      PYTHONUTF8: "1"
      SIGNVISION_TRACKING_ENABLED: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out PR and base history without credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up lightweight ML test Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-ci-light.txt
      - name: Install lightweight CPU test dependencies only
        run: python -m pip install --timeout 1000 --retries 10 -r backend/requirements-ci-light.txt
      - name: Assert sandbox dependencies are available
        run: python -c "import numpy, scipy, sklearn, yaml; print('CPU sandbox dependencies available')"
      - name: Reproduce fitted sandbox comparison and guard production artifact changes
        run: python -m tracking.pr_gate --base-sha "$PR_BASE_SHA" --report "$RUNNER_TEMP/pr-sandbox-evaluation.json"
      - name: Run backend tests with genuine sandbox fitting enabled
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v
      - name: Retain explicitly sandbox-only assessment (never production approval)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr-sandbox-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-sandbox-evaluation.json
          if-no-files-found: warn
          retention-days: 7

  candidate_approval:
    name: Evidence-backed candidate approval (no deployment)
    if: github.event_name == 'workflow_dispatch' && inputs.evaluate_candidate && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: candidate-approval
    env:
      PYTHONPATH: backend
      PYTHONUTF8: "1"
      SIGNVISION_TRACKING_ENABLED: "false"
      OMP_NUM_THREADS: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
      CANDIDATE_DIR: candidate-source/${{ inputs.candidate_bundle }}
      SIGNVISION_PRODUCTION_ALPHABET_MANIFEST_SHA256: ${{ vars.SIGNVISION_PRODUCTION_ALPHABET_MANIFEST_SHA256 }}
      SIGNVISION_PRODUCTION_WORD_MANIFEST_SHA256: ${{ vars.SIGNVISION_PRODUCTION_WORD_MANIFEST_SHA256 }}
    steps:
      - name: Check out trusted main workflow and production evidence
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out reviewed candidate artifacts (not executable application code)
        id: candidate_checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          path: candidate-source
          persist-credentials: false
      - name: Set up evaluation Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-evaluation.txt
      - name: Fail closed on absent historical holdout evidence before downloads
        run: >-
          python -m tracking.evaluate_models --check-evidence
          --production-dir backend/data/models --candidate-dir "$CANDIDATE_DIR"
          --workspace "$GITHUB_WORKSPACE" --candidate-root "$GITHUB_WORKSPACE/candidate-source"
      - name: Install DVC HTTP client (manual job only)
        run: python -m pip install --timeout 1000 --retries 10 'dvc[http]==3.67.1'
      - name: Retrieve pinned dataset without logging credentials
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          username = os.environ.get("DAGSHUB_USERNAME", "")
          token = os.environ.get("DAGSHUB_TOKEN", "")
          if not username or not token:
              raise SystemExit("Dataset retrieval credentials are not configured")
          local = Path(".dvc/config.local")
          if local.exists():
              raise SystemExit("Refusing to overwrite existing local DVC configuration")
          def dvc(*args):
              result = subprocess.run([sys.executable, "-m", "dvc", *args],
                                      capture_output=True, text=True)
              if result.returncode:
                  # Captured stdout/stderr/arguments may contain credentials.
                  raise SystemExit("DVC retrieval/configuration failed; check remote access and dataset availability")
          try:
              dvc("remote", "modify", "--local", "origin", "auth", "basic")
              dvc("remote", "modify", "--local", "origin", "user", username)
              dvc("remote", "modify", "--local", "origin", "password", token)
              local.chmod(0o600)
              dvc("pull", "backend/data/db/main_dataset.db.dvc")
          finally:
              local.unlink(missing_ok=True)
          PY
      - name: Install inference-only evaluation dependencies (no MediaPipe or MLflow)
        run: python -m pip install --timeout 1000 --retries 10 -r backend/requirements-evaluation.txt
      - name: Evaluate both bundles and require both gates to pass
        env:
          CANDIDATE_GIT_COMMIT: ${{ steps.candidate_checkout.outputs.commit }}
        run: >-
          python -m tracking.evaluate_models
          --production-dir backend/data/models --candidate-dir "$CANDIDATE_DIR"
          --dataset backend/data/db/main_dataset.db
          --output-dir "$RUNNER_TEMP/signvision-evaluation"
          --workspace "$GITHUB_WORKSPACE" --candidate-root "$GITHUB_WORKSPACE/candidate-source"
      # A gate failure exits nonzero. No continue-on-error or always() upload.
      - name: Publish gated approval evidence only after both tasks pass
        uses: actions/upload-artifact@v6
        with:
          name: gated-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signvision-evaluation/
          if-no-files-found: error
          retention-days: 14
